<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com;
        style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data:;
        form-action 'self';
        frame-ancestors 'none';
      "
    />
    <title>404 - Page Not Found | Brent Crystal</title>
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="The page you're looking for couldn't be found. Return to Brent Crystal's resume."
    />
    <link rel="icon" href="images/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/404.css" />
  </head>
  <body>
    <div class="container">
      <div class="error-wrapper">
        <div class="error-code">404</div>
        <img
          src="images/custom-not-found.webp"
          alt="A cute squirrel laying relaxed on a branch. "
          loading="lazy"
          class="not-found-image"
        />
      </div>

      <h1>Oops!</h1>
      <h2>Page Not Found</h2>
      <p>
        The page you're looking for doesn't exist or has been moved. But don't
        worry—let me help you get back on track.
      </p>

      <div class="button-group">
        <a href="/" class="btn-primary">
          <i class="fa-solid fa-home icon"></i>Back to Resume
        </a>
        <a href="mailto:brentrcrystal@gmail.com" class="btn-secondary">
          <i class="fa-solid fa-envelope icon"></i>Contact Me
        </a>
      </div>

      <div class="footer-note">
        <p>
          If you believe this is an error, please
          <a href="mailto:brentrcrystal@gmail.com" class="footer-link"
            >contact me</a
          >.
        </p>
      </div>
    </div>
  </body>
</html>
